[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ebm-trading-audit"
version = "0.1.0"
description = "Frozen SPY EBM trading audit: executable controls and honest uncertainty"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "pyarrow>=15", "matplotlib>=3.8", "exchange-calendars>=4.5"]

[project.optional-dependencies]
test = ["pytest>=8"]
train = ["interpret-core>=0.7", "scikit-learn>=1.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebm_audit = ["*.cpp"]
